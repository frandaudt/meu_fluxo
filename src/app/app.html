<header class="top-bar-verde" *ngIf="mostrarLayout">
  <div class="brand-logo">
    <img src="assets/icons/icone-logo-meufluxo.png" alt="" class="brand-logo-icon" />
    <h2>MeuFluxo</h2>
  </div>

  <div class="top-bar-right">
    <div class="search-input">
      🔍
      <input
        type="text"
        placeholder="Buscar clientes..."
        [(ngModel)]="termoBusca"
        (keyup.enter)="buscarClientes()"
      />
    </div>

      <div class="user-pill" (click)="toggleMenuUsuario($event)">
      <div class="user-avatar-iniciais">{{ inicialUsuario }}</div>
      <span>{{ primeiroNomeUsuario }}</span>
      <small>▼</small>

      <div class="user-dropdown" *ngIf="menuUsuarioAberto" (click)="$event.stopPropagation()">
        <a routerLink="/perfil" class="dropdown-item">👤 Meu Perfil</a>
        <button class="dropdown-item dropdown-sair" (click)="sair()">⏻ Sair</button>
      </div>
    </div>
  </div>
</header>

<div class="app-body" [class.no-layout]="!mostrarLayout">
  <app-menu-lateral *ngIf="mostrarLayout"></app-menu-lateral>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
