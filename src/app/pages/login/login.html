<div class="auth-container">
  <div class="auth-card">
    <div class="auth-icon">📅</div>
    <h2>MeuFluxo</h2>
    <p class="subtitle">Entre para continuar organizando o seu negócio</p>

    <div class="auth-form">
      <div class="input-group">
        <label>E-mail</label>
        <input type="email" placeholder="seuemail@exemplo.com" />
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" placeholder="••••••••" />
      </div>

      <button routerLink="/tela-inicial" class="btn-primary">Entrar</button>
    </div>

    <div class="auth-footer">
      Ainda não tem conta? <a routerLink="/cadastro">Criar uma conta</a>
    </div>
  </div>
</div>
